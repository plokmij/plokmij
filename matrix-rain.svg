<svg xmlns="http://www.w3.org/2000/svg" width="850" height="300" viewBox="0 0 850 300">
  <defs>
    <linearGradient id="gridFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff41;stop-opacity:0"/>
      <stop offset="30%" style="stop-color:#00ff41;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#00ff41;stop-opacity:0.8"/>
    </linearGradient>
    <linearGradient id="horizonGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff41;stop-opacity:0"/>
      <stop offset="70%" style="stop-color:#00ff41;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes fall0 { 0% { transform: translateY(-200px); } 100% { transform: translateY(350px); } }
    @keyframes fall1 { 0% { transform: translateY(-180px); } 100% { transform: translateY(350px); } }
    @keyframes fall2 { 0% { transform: translateY(-220px); } 100% { transform: translateY(350px); } }
    @keyframes fall3 { 0% { transform: translateY(-160px); } 100% { transform: translateY(350px); } }
    @keyframes fall4 { 0% { transform: translateY(-240px); } 100% { transform: translateY(350px); } }
    @keyframes gridPulse { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; } }
    .bg { fill: #0d1117; }
    .col { font-family: monospace; font-size: 14px; fill: #00ff41; }
    .c0 { animation: fall0 2.1s linear infinite; }
    .c1 { animation: fall1 2.4s linear infinite; animation-delay: 0.3s; }
    .c2 { animation: fall2 1.9s linear infinite; animation-delay: 0.1s; }
    .c3 { animation: fall3 2.6s linear infinite; animation-delay: 0.5s; }
    .c4 { animation: fall4 2.2s linear infinite; animation-delay: 0.2s; }
    .c5 { animation: fall0 2.5s linear infinite; animation-delay: 0.4s; }
    .c6 { animation: fall1 2.0s linear infinite; animation-delay: 0.6s; }
    .c7 { animation: fall2 2.3s linear infinite; animation-delay: 0.15s; }
    .c8 { animation: fall3 2.1s linear infinite; animation-delay: 0.35s; }
    .c9 { animation: fall4 2.7s linear infinite; animation-delay: 0.55s; }
    .bright { fill: #ffffff; }
    .grid-line { stroke: #00ff41; fill: none; animation: gridPulse 3s ease-in-out infinite; }
    .grid-glow { stroke: #00ff41; stroke-width: 2; fill: none; opacity: 0.3; }
  </style>
  <rect class="bg" width="850" height="300"/>

  <!-- Tron Grid at bottom -->
  <g id="tron-grid">
    <!-- Horizon glow overlay -->
    <rect x="0" y="210" width="850" height="90" fill="url(#horizonGlow)"/>

    <!-- Horizontal perspective lines -->
    <line class="grid-line" x1="0" y1="300" x2="850" y2="300" stroke-width="2"/>
    <line class="grid-line" x1="50" y1="285" x2="800" y2="285" stroke-width="1.5" opacity="0.9"/>
    <line class="grid-line" x1="100" y1="272" x2="750" y2="272" stroke-width="1.3" opacity="0.8"/>
    <line class="grid-line" x1="140" y1="261" x2="710" y2="261" stroke-width="1.1" opacity="0.7"/>
    <line class="grid-line" x1="175" y1="252" x2="675" y2="252" stroke-width="1" opacity="0.6"/>
    <line class="grid-line" x1="205" y1="244" x2="645" y2="244" stroke-width="0.9" opacity="0.5"/>
    <line class="grid-line" x1="230" y1="237" x2="620" y2="237" stroke-width="0.8" opacity="0.4"/>
    <line class="grid-line" x1="255" y1="231" x2="595" y2="231" stroke-width="0.7" opacity="0.3"/>
    <line class="grid-line" x1="275" y1="226" x2="575" y2="226" stroke-width="0.6" opacity="0.2"/>

    <!-- Vertical perspective lines converging to center horizon -->
    <line class="grid-line" x1="425" y1="220" x2="425" y2="300" stroke-width="1.5" opacity="0.9"/>
    <line class="grid-line" x1="425" y1="220" x2="0" y2="300" stroke-width="1" opacity="0.7"/>
    <line class="grid-line" x1="425" y1="220" x2="850" y2="300" stroke-width="1" opacity="0.7"/>
    <line class="grid-line" x1="425" y1="220" x2="85" y2="300" stroke-width="0.8" opacity="0.6"/>
    <line class="grid-line" x1="425" y1="220" x2="765" y2="300" stroke-width="0.8" opacity="0.6"/>
    <line class="grid-line" x1="425" y1="220" x2="170" y2="300" stroke-width="0.7" opacity="0.5"/>
    <line class="grid-line" x1="425" y1="220" x2="680" y2="300" stroke-width="0.7" opacity="0.5"/>
    <line class="grid-line" x1="425" y1="220" x2="255" y2="300" stroke-width="0.6" opacity="0.4"/>
    <line class="grid-line" x1="425" y1="220" x2="595" y2="300" stroke-width="0.6" opacity="0.4"/>
    <line class="grid-line" x1="425" y1="220" x2="340" y2="300" stroke-width="0.5" opacity="0.3"/>
    <line class="grid-line" x1="425" y1="220" x2="510" y2="300" stroke-width="0.5" opacity="0.3"/>

    <!-- Bright horizon line -->
    <line class="grid-glow" x1="300" y1="220" x2="550" y2="220" stroke-width="3"/>
    <line class="grid-line" x1="300" y1="220" x2="550" y2="220" stroke-width="1.5"/>
  </g>

